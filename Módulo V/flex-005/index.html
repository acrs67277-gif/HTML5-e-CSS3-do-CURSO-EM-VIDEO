<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização absoluta com Flexbox</title>
    <style>
       * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
       }

       body {
            background-color: #633c3c;
       }

       main {
            background-color: red;
            height: 100vh;
            width: 100vw;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
       }

       section {
            background-color: chartreuse;
            height: 240px;
            width: 200px;
       }
       
       section h1 {
            text-align: center;
       }

       section p {
            text-align: justify;
            padding: 6px;
            margin: 6px;
            color: #5900ff;
            font-family:'Times New Roman', Times, serif;
            font-size: 1em;
       }

       section  p#password label, input {
            display: block;
            margin-bottom: 6px;
       }

       footer {
            background-color: #633c3c;
            color: #fff;
            text-align: center;
            padding: 6px;
       }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
            <p>Por favor, faça o login para continuar.</p>
            <p id="password">
                <label for="username">Nome de usuário:</label>
                <input type="text" id="username" name="username">
            </p>
            <p id="password">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password">
                <input type="submit" value="Entrar">
            </p>
        </section>
    </main>
    <footer>
        <p>
            &copy; Texto gerado por IA &copy; Por Curso em Vídeo.
        </p>
    </footer>
</body>
</html>
