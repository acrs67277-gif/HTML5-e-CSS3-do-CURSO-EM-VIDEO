<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>
                    Seja bem-vindo(a) novamente. Faça login
                    para acessar sua conta o poder fazer as 
                    configurações no seu ambiente.
                </p>
                <form action="php/login.php" method="get"autocomplete="on">
                    <div class="campo">
                        <p>
                            <span class="material-symbols-outlined">person<span>
                        </p>
                        <input type="email" name="login" id="ilogin" placeholder="Seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="ilogin"></label>
                    </div>
                    <div class="campo">
                        <p>
                            <span class="material-symbols-outlined">vpn_key<span>
                        </p>
                        <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20">

                        <label for="isenha"></label> <br><br>
                        <input type="submit" value="Entrar">

                        <a href="esqueci.html" class="botao"><span class="material-symbols-outlined">Mail</span>
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
