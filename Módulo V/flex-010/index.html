<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        div.conteiner {
            background-color: blueviolet;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: #000000;
            color: #ffd902;
            border: 1px solid #09ff00;
            text-align: center;
            flex-basis: 200px;
        }

        div#caixa-1 {
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#caixa-2 {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#caixa-3 {
            flex-shrink: 3;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <h1>Controle do tamanho de itens flexíveis</h1>
    <div class="conteiner">
        <div class="item" id="caixa-1">Lorem ipsum dolor</div>
        <div class="item" id="caixa-2">Lorem ipsum dolor</div>
        <div class="item" id="caixa-3">Lorem ipsum dolor</div>
    </div>
</body>
</html>
